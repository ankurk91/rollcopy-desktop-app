[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ankurk91/unspool-desktop-app"
publish = false

[workspace.dependencies]
unspool-device = { path = "crates/unspool-device" }
unspool-library = { path = "crates/unspool-library" }
unspool-convert = { path = "crates/unspool-convert" }
unspool-queue = { path = "crates/unspool-queue" }

# UI: gpui-kit bundles gpui-component 0.9.x with `gpui-pre` (a crates.io snapshot
# of Zed's gpui, pinned =0.3.12 by gpui-kit) and the Linux X11/Wayland platform.
# It is not built on `gpui` 0.2.x. Pinned exactly: pre-1.0, APIs move.
gpui-kit = "=0.9.1"

[profile.dev.package."*"]
opt-level = 2
# Match release behaviour for third-party crates: gpui's accessibility code
# panics on some debug-only checks (e.g. "set_focus called more than once in
# a single frame" from the settings number input) that only warn in release.
debug-assertions = false
