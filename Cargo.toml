[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/ankurk91/rollcopy-desktop-app"
publish = false

[workspace.dependencies]
rollcopy-device = { path = "crates/rollcopy-device" }
rollcopy-library = { path = "crates/rollcopy-library" }
rollcopy-convert = { path = "crates/rollcopy-convert" }
rollcopy-queue = { path = "crates/rollcopy-queue" }

# UI: gpui-kit bundles gpui-component 0.9.x with `gpui-pre` (a crates.io snapshot
# of Zed's gpui, pinned =0.3.12 by gpui-kit) and the Linux X11/Wayland platform.
# It is not built on `gpui` 0.2.x. Pinned exactly: pre-1.0, APIs move.
gpui-kit = "=0.9.1"

[profile.dev]
# Line tables are enough for backtraces; full debug info made target/ ~47 GB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
# Match release behaviour for third-party crates: gpui's accessibility code
# panics on some debug-only checks (e.g. "set_focus called more than once in
# a single frame" from the settings number input) that only warn in release.
debug-assertions = false

[profile.release]
# Smaller installed binary (debug symbols are not shipped).
strip = true

# Lint policy for every crate (audit MNT-01). unwrap/expect are allowed in
# tests (clippy.toml); elsewhere each use states its invariant.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
