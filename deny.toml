# cargo-deny policy, checked in CI (`cargo deny check`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Rollcopy ships for Linux amd64 only.
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
# RustSec advisories: vulnerabilities fail the build; unmaintained crates
# only fail when Rollcopy depends on them directly.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # "Marvin" timing side channel in RSA decryption (rsa 0.9, via idevice's
    # pairing code). Exploiting it needs an attacker timing many decryptions
    # over a network; Rollcopy only uses RSA locally to pair with a phone over
    # USB. No fixed rsa release exists yet; drop this when idevice moves to
    # rsa 0.10.
    { id = "RUSTSEC-2023-0071", reason = "local-only RSA use in idevice pairing; no fix released" },
]

[licenses]
# Licences compatible with shipping an MIT binary. MPL-2.0 is file-level
# copyleft (option-ext, used unmodified); CDLA-Permissive-2.0 covers the
# webpki-roots certificate list (update check); Unlicense: ksni.
allow = [
    "MIT",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
