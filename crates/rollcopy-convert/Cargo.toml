[package]
name = "rollcopy-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Bundled libheif 1.23 (built with cmake against the system libde265 HEVC
# decoder). The system libheif 1.17.6 could not open about a third of the
# iOS 27 HEICs tested ("Non-existing item ID referenced", portrait/depth photos).
libheif-rs = { version = "=3.0.0", default-features = false, features = ["embedded-libheif", "v1_23"] }
thiserror = "2"
