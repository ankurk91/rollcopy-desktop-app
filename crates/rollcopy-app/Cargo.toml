[package]
name = "rollcopy-app"
description = "Copy photos and videos from an iPhone to Linux over USB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rollcopy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rollcopy-device.workspace = true
rollcopy-library.workspace = true
rollcopy-queue.workspace = true
rollcopy-convert.workspace = true
gpui-kit.workspace = true
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "process"] }
gpui-kit-assets = "=0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
serde_json = "1.0.154"
semver = "1.0.28"
ureq = "3.5.2"
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
resvg = "0.50.0"
zbus = { version = "6.2", default-features = false, features = ["tokio", "service"] }

[dev-dependencies]
tempfile = "3.27.0"

# `cargo deb -p rollcopy-app` (cargo-deb 3.8) → target/debian/rollcopy_<ver>-1_amd64.deb
[package.metadata.deb]
name = "rollcopy"
maintainer = "ankurk91 <6111524+ankurk91@users.noreply.github.com>"
copyright = "2026 ankurk91"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Plug in your iPhone, pick photos and videos, and get Android/PC-friendly \
files: HEIC becomes JPG and MOV becomes MP4, arranged by date. Read-only \
towards the phone."""
section = "graphics"
priority = "optional"
# $auto adds the shared libraries the binary links (e.g. libde265).
depends = "$auto, usbmuxd, ffmpeg"
assets = [
    ["target/release/rollcopy", "usr/bin/", "755"],
    ["../../packaging/io.github.ankurk91.Rollcopy.desktop", "usr/share/applications/", "644"],
    ["../../packaging/io.github.ankurk91.Rollcopy.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/icons/io.github.ankurk91.Rollcopy.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/rollcopy/README.md", "644"],
]

