[package]
name = "unspool-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust usbmuxd/lockdown/AFC client. `ring` instead of the default aws-lc
# for a simpler build. Needs the system usbmuxd daemon at runtime.
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "usbmuxd", "pair", "afc", "device_info", "diagnostics_relay"] }
