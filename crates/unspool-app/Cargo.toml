[package]
name = "unspool-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "unspool"
path = "src/main.rs"

[dependencies]
unspool-device.workspace = true
unspool-library.workspace = true
unspool-queue.workspace = true
unspool-convert.workspace = true
gpui-kit.workspace = true
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "process"] }
gpui-kit-assets = "=0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
serde_json = "1.0.154"
semver = "1.0.28"
ureq = "3.5.2"
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
resvg = "0.50.0"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27.0"
