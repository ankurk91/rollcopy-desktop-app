name: Release

# Push a semver tag like v0.1.0 to build packages and create a DRAFT release.
# Review the draft on GitHub and publish it by hand; "Check for updates"
# only sees published releases. Run manually to just build the packages.
on:
  push:
    tags:
      # GitHub tag filters are globs, not regex: this matches vMAJOR.MINOR.PATCH
      # only (e.g. v0.1.0, v1.12.3). The first step checks it with a regex too.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Nothing can write by default; only the publish job gets write access.
permissions:
  contents: read

# One release run at a time; a new run waits for the running one instead of
# cancelling it (a cancelled run could leave a half-made draft release).
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Compiles ~860 third-party crates (their build scripts run here), so it
  # has a read-only token, keeps no credentials and uses no shared cache.
  # Tests aren't re-run: CI already gates every commit on main.
  build:
    name: Build .deb + AppImage (Ubuntu 24.04, amd64)
    runs-on: ubuntu-24.04
    # A cold release build and packaging take ~30 min; fail stuck runs early.
    timeout-minutes: 75
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag is semver and matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install system packages
        run: packaging/ci-deps.sh

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      - name: Build the release binary
        run: cargo build --release --locked -p rollcopy-app

      - name: Build the .deb package
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo deb -p rollcopy-app --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/

      - name: Build the AppImage
        run: packaging/build-appimage.sh

      - name: Write SHA256 checksums
        working-directory: dist
        run: sha256sum -- *.deb *.AppImage | tee SHA256SUMS

      - name: Upload packages as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollcopy-packages
          path: dist/*
          if-no-files-found: error

  # Only downloads the finished packages; nothing is compiled or run here.
  publish:
    name: Attest and create a draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the draft release
      id-token: write # signing the build provenance
      attestations: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rollcopy-packages
          path: dist

      - name: Attest build provenance (verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.AppImage

      - name: Create a draft GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
