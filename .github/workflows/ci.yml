name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (Ubuntu 24.04, amd64)
    runs-on: ubuntu-24.04
    # A cold build takes ~25 min (clippy ~9, tests ~10); fail stuck runs early.
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system packages
        run: packaging/ci-deps.sh

      - name: Install ffmpeg (for the video conversion test)
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Rust (stable, with rustfmt and clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  packaging:
    name: Desktop file and AppStream metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream

      - name: Validate the .desktop file
        run: desktop-file-validate packaging/io.github.ankurk91.Rollcopy.desktop

      - name: Validate the AppStream metainfo
        run: appstreamcli validate --no-net packaging/io.github.ankurk91.Rollcopy.metainfo.xml
