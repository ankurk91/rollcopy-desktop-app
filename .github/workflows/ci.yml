name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (Ubuntu 24.04, amd64)
    runs-on: ubuntu-24.04
    # A cold build takes ~25 min (clippy ~9, tests ~10); fail stuck runs early.
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install system packages
        run: packaging/ci-deps.sh

      - name: Install Rust (stable, with rustfmt and clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace
