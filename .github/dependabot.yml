# One grouped pull request per ecosystem, once a month on the 15th. The
# cooldown skips releases younger than two weeks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 15 * *"
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 15 * *"
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # Pinned on purpose (pre-1.0, APIs move); updated by hand with testing.
      - dependency-name: gpui-kit
      - dependency-name: gpui-kit-assets
      - dependency-name: idevice
      - dependency-name: libheif-rs
